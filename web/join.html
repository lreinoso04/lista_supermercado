<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unirse a Lista - SmartCart</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #F8F9FA;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      text-align: center;
    }
    .card {
      background: white;
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 400px;
      width: 100%;
    }
    .icon {
      font-size: 54px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 24px;
      color: #1B5E20;
      margin-bottom: 8px;
    }
    p {
      color: #616161;
      font-size: 15px;
      line-height: 1.5;
    }
    .pin-box {
      background: #E8F5E9;
      border: 2px dashed #4CAF50;
      border-radius: 12px;
      padding: 14px;
      margin: 20px 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #2E7D32;
    }
    .btn {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      background-color: #2E7D32;
      color: white;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: #1B5E20;
    }
    .footnote {
      margin-top: 16px;
      font-size: 13px;
      color: #9E9E9E;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛒</div>
    <h1>Unirse a Lista en SmartCart</h1>
    <p>Has recibido una invitación para colaborar en tiempo real en una lista de compras.</p>
    
    <div class="pin-box" id="pin-display">CARGANDO...</div>
    
    <a href="#" id="open-app-btn" class="btn">Abrir en SmartCart</a>
    
    <p class="footnote">Si la app no se abre automáticamente, ábrela e introduce este PIN en "Conectarse a una Lista".</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const pin = urlParams.get('pin') || urlParams.get('code') || '';
    const pinDisplay = document.getElementById('pin-display');
    const openBtn = document.getElementById('open-app-btn');

    if (pin) {
      pinDisplay.textContent = pin.toUpperCase();
      const customScheme = `smartcart://join?pin=${pin.toUpperCase()}`;
      openBtn.href = customScheme;
      // Intento de redirección automática hacia la app
      window.location.href = customScheme;
    } else {
      pinDisplay.textContent = 'SIN PIN';
      openBtn.style.display = 'none';
    }
  </script>
</body>
</html>
